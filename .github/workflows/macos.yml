name: macOS

# Checks the Swift corrector against the behaviour contract in
# Tests/MurmurDictionaryTests/dictionary-test-vectors.json.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'Package.swift', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'Package.swift', '.github/workflows/macos.yml']

permissions:
  contents: read

jobs:
  dictionary-contract:
    name: Dictionary contract
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The manifest needs Swift 6.2 and the image defaults to an older toolchain. Taking the
      # newest installed Xcode avoids a version pin that goes stale.
      - name: Use the newest Xcode on the runner
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Print the Swift version
        run: swift --version

      # MurmurDictionary has no app or platform dependencies, so it runs on an image that lacks
      # macOS 26 and the Speech framework.
      - name: Run the dictionary vectors
        run: swift test --filter VectorTests
