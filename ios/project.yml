# The iOS app and its keyboard extension. `make ios-project` generates ios/Murmur.xcodeproj
# and the two Info.plists, which are committed because Xcode Cloud builds the checked-in project; the entitlements files are checked in. The text
# pipeline, speech engines, settings and run log come from the repo's SwiftPM package.
name: Murmur
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
fileGroups:
  - Base.xcconfig
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
packages:
  Murmur:
    path: ..

targets:
  MurmurPhone:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist"]
      - path: Shared
      # The design system's faces, the same files the Mac bundles. `UIAppFonts` below
      # registers them; `DS.Font` falls back to SF for any face that does not resolve.
      - path: ../Resources/Fonts
        includes: ["*.ttf", "OFL-*.txt"]
        buildPhase: resources
      # The keyboard's wordmark font ships in the keyboard; its licence text also sits here so
      # Settings -> Licences can show it.
      - path: ../Tools/Fonts
        includes: ["OFL-EBGaramond.txt"]
        buildPhase: resources
      # The starter dictionary `DictionaryStore.shared` seeds from on first launch, as on the Mac.
      - path: ../Resources/default-dictionary.txt
        buildPhase: resources
    dependencies:
      - package: Murmur
        product: MurmurKit
      - package: Murmur
        product: MurmurDictionary
      - package: Murmur
        product: MurmurDesign
      - target: MurmurKeyboard
    entitlements:
      path: App/MurmurPhone.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.pivotstudio.murmur
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only Apple's standard encryption (HTTPS for the model download): exempt, so TestFlight
        # builds need no export-compliance answer.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIAppFonts:
          - Figtree[wght].ttf
          - Fraunces[SOFT,WONK,opsz,wght].ttf
          - Fraunces-Italic[SOFT,WONK,opsz,wght].ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: ai.pivotstudio.murmur.ios
            CFBundleURLSchemes:
              - murmur
        NSMicrophoneUsageDescription: Murmur records your voice while you hold the dictation key, then types what you said.
        NSSpeechRecognitionUsageDescription: Murmur turns your voice into text on this iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pivotstudio.murmur.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MurmurKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: ["Info.plist"]
      - path: Shared
      # The m of the dictation button is set in the app icon's face. The OFL requires its text to travel
      # with the font. `UIAppFonts` below registers the TTF; `DS.Keyboard.mGlyphFont` falls
      # back to SF italic if it does not resolve.
      - path: ../Tools/Fonts
        includes: ["EBGaramond-Italic*.ttf", "OFL-EBGaramond.txt"]
        buildPhase: resources
    dependencies:
      - package: Murmur
        product: MurmurKit
      - package: Murmur
        product: MurmurDictionary
      - package: Murmur
        product: MurmurDesign
      - package: Murmur
        product: MurmurTyping
    entitlements:
      path: Keyboard/MurmurKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.pivotstudio.murmur
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Murmur records your voice while you hold the dictation key, then types what you said.
        NSSpeechRecognitionUsageDescription: Murmur turns your voice into text on this iPhone.
        # Lets the keyboard run its display link, and so its touch handling, at a ProMotion
        # screen's 120 Hz. Without it an iPhone caps a process at 60. Whether iOS honours it in
        # a keyboard extension is unverified; the diagnostics log's `timing` lines will say.
        CADisableMinimumFrameDurationOnPhone: true
        UIAppFonts:
          - EBGaramond-Italic[wght].ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            RequestsOpenAccess: true
            PrimaryLanguage: en-US
            IsASCIICapable: true
            PrefersRightToLeft: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.pivotstudio.murmur.ios.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES

# A shared scheme, because Xcode Cloud only sees schemes stored in xcshareddata. Archive builds
# Release; the keyboard is built with the app that embeds it.
schemes:
  MurmurPhone:
    build:
      targets:
        MurmurPhone: all
        MurmurKeyboard: all
    run:
      config: Debug
    archive:
      config: Release
